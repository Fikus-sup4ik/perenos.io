name = "lampa-history-transfer"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
MAX_BACKUP_BYTES = "10485760"
SESSION_TTL_DAYS = "30"
MAX_BACKUPS_PER_USER = "20"
ALLOWED_ORIGINS = "*"

[[d1_databases]]
binding = "DB"
database_name = "lampa-history-transfer"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Секреты задаются через CLI (НЕ хранятся в wrangler.toml):
# npx wrangler secret put TOKEN_PEPPER
